name: Desktop editor and local AI

on:
  push:
    branches:
      - main
      - feature/local-ai-connection
      - feature/0.15-flame-library
      - feature/0.16-render-proof
    paths:
      - .github/workflows/local-ai.yml
      - CMakeLists.txt
      - cmake/**
      - src/ai_mcp/**
      - src/editor/**
      - src/script*
      - tests/local_ai*
      - tests/flame_favorites_tests.cpp
      - tests/variation_explorer_tests.cpp
      - tests/editor_tests.cpp
      - src/legacy_document.*
      - src/editable_png.*
      - src/render*
      - src/flame_io.*
      - src/density_estimation.*
      - src/image_stream.*
      - src/main.cpp
      - tests/render_proof*
      - tests/render_queue_tests.cpp
      - tests/file_render_tests.cpp
      - tests/image_stream_tests.cpp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux desktop and MCP
    runs-on: ubuntu-24.04
    container: debian:trixie-slim
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      APO_AI_REQUIRE_SOCKET_TEST: '1'
    steps:
      - name: Install build tools and native Qt
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates g++ cmake ninja-build python3 qt6-base-dev libgl-dev \
            libexpat1-dev zlib1g-dev
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build the editor, helper and live integration test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 3 --target apophysis-reborn apophysis-mcp local-ai-editor-tests flame-favorites-tests variation-explorer-tests editor-tests render-proof-dialog-tests render-proof-tests file-render-tests render-queue-tests image-stream-tests
          build/apophysis-mcp --version
      - name: Exercise MCP and the real editor over local sockets
        run: |
          ctest --test-dir build --no-tests=error --output-on-failure -R '^(flame_favorites|variation_explorer|editor_workflow|render_proof|render_proof_dialog|file_render|render_queue|image_stream)$'
          ctest --test-dir build --no-tests=error --verbose -R '^local_ai_mcp$'
          ctest --test-dir build --no-tests=error --verbose -R '^local_ai_editor$'

  windows:
    name: Windows x64 desktop and MCP
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      # The live test enables sharing for this disposable hosted runner profile.
      APO_AI_ISOLATED_WINDOWS_TEST: '1'
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-llvm-tools
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-qt6-base
            mingw-w64-clang-x86_64-expat
            mingw-w64-clang-x86_64-zlib
      - name: Build the native Windows executables
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++
          cmake --build build --parallel 3 --target apophysis-reborn apophysis-mcp local-ai-editor-tests flame-favorites-tests variation-explorer-tests editor-tests render-proof-dialog-tests render-proof-tests file-render-tests render-queue-tests image-stream-tests
          ./build/apophysis-mcp.exe --version
      - name: Exercise MCP and the real editor over local named pipes
        id: windows_tests
        run: |
          ctest --test-dir build --no-tests=error --output-on-failure -R '^(flame_favorites|variation_explorer|editor_workflow|render_proof|render_proof_dialog|file_render|render_queue|image_stream)$'
          ctest --test-dir build --no-tests=error --verbose -R '^local_ai_mcp$'
          ctest --test-dir build --no-tests=error --verbose -R '^local_ai_editor$'
      - name: Identify individual queue cases after a Windows test failure
        if: failure() && steps.windows_tests.outcome == 'failure'
        run: |
          ./build/render-queue-tests.exe -functions | tr -d '\r' | sed 's/()$//' > queue-functions.txt
          while IFS= read -r test_case; do
            echo "::group::Render queue — $test_case"
            ./build/render-queue-tests.exe "$test_case" -v1 || echo "Queue case failed — $test_case"
            echo "::endgroup::"
          done < queue-functions.txt
