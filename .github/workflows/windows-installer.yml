name: Build and verify Windows installer
on:
  workflow_dispatch:
  push:
    branches: [packaging/0.17-installer]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:trixie-slim
    timeout-minutes: 45
    steps:
      - name: Install Linux Qt host tools and build dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl git python3 g++ cmake ninja-build qt6-base-dev unzip xz-utils zstd
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build audited Windows payload and installer
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash packaging/build-windows-x64.sh /tmp/windows-build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-x64-setup
          path: /tmp/windows-build/output/*-setup.exe
          if-no-files-found: error
          compression-level: 0
  upgrade:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-x64-setup
          path: setup
      - name: Upgrade two installed versions and verify the new CLI
        shell: pwsh
        run: |
          $setup = (Get-ChildItem setup/*-setup.exe).FullName
          & ./tests/verify-multiple-upgrade.ps1 -Installer $setup -Work "$env:RUNNER_TEMP/upgrade"
